# -------------------------------
# General
# -------------------------------
imagePullSecrets:
  - name: registry-credentials

starburstPlatformLicense: starburst-license
environment: dev
sharedSecret: abcdefg

additionalVolumes:
  - path: /etc/starburst/groups.txt
    subPath: groups.txt
    volume:
      configMap:
        name: sep-groups
  - path: /mnt/shared
    volume:
      emptyDir: {}
  - path: /mnt/shared/fetch-certs.sh
    subPath: fetch-certs.sh
    volume:
      configMap:
        name: fetch-certs
        defaultMode: 0777

initFile: |
  #!/bin/bash
  set -euxo pipefail

  if [ "${1:-}" == "coordinator" ]; then
      mkdir -p /etc/starburst/certs/
      echo "Placing certificates..."
      cp /mnt/shared/keystore.jks /etc/starburst/certs/
  fi
  echo "Starting starburst"
  exec /usr/lib/starburst/bin/run-starburst

catalogs:
  insights: |-
    connector.name=postgresql
    connection-url=jdbc:postgresql://insightsdb:5432/insights
    connection-user=${ENV:INSIGHTS_USR}
    connection-password=${ENV:INSIGHTS_PSWD}

# -------------------------------
# Coordinator
# -------------------------------
coordinator:
  # Issue 1: Cap memory and CPU for local dev laptops
  resources:
    limits:
      memory: "4Gi"
      cpu: 1
    requests:
      memory: "4Gi"
      cpu: 1
  nodeMemoryHeadroom: "512Mi"

  initContainers:
    - name: cert-manager
      image: harbor.starburstdata.net/starburstdata/starburst-enterprise:453-e.4
      env:
        - name: LDAP_HOST
          value: "openldap.example.com"
        - name: LDAP_PORT
          value: "636"
        - name: LDAP_CERT
          value: "/mnt/shared/ldapserver.crt"
      command: ["bash", "-c", "/mnt/shared/fetch-certs.sh"]

  envFrom:
    - secretRef:
        name: sep-secrets

  etcFiles:
    # Issue 4: Override JVM security to allow older MySQL 5.6 Aurora DH ciphers
    jvm.config: |-
      -server
      -XX:G1HeapRegionSize=32M
      -XX:+ExplicitGCInvokesConcurrent
      -XX:+HeapDumpOnOutOfMemoryError
      -XX:-OmitStackTraceInFastThrow
      -XX:ReservedCodeCacheSize=512M
      -XX:PerMethodRecompilationCutoff=10000
      -XX:PerBytecodeRecompilationCutoff=10000
      -Djdk.attach.allowAttachSelf=true
      -Djdk.nio.maxCachedBufferSize=2000000
      -Dfile.encoding=UTF-8
      --add-opens=java.base/sun.nio.ch=ALL-UNNAMED
      --add-opens=java.base/java.nio=ALL-UNNAMED
      --add-opens=java.base/java.lang=ALL-UNNAMED
      --add-opens=java.security.jgss/sun.security.krb5=ALL-UNNAMED
      -XX:+UseG1GC
      -agentpath:/usr/lib/starburst/bin/libjvmkill.so
      -XX:+UnlockDiagnosticVMOptions
      -XX:G1NumCollectionsKeepPinned=10000000
      -Djdk.attach.allowAttachSelf=true
      -XX:+UseAESCTRIntrinsics
      -XX:GCLockerRetryAllocationCount=100
      -Djdk.tls.disabledAlgorithms=SSLv3, RC4, DES, MD5withRSA, EC keySize < 224, 3DES_EDE_CBC, anon, NULL

    properties:
      config.properties: |-
        coordinator=true
        node-scheduler.include-coordinator=false
        http-server.http.port=8080
        discovery.uri=http://localhost:8080
        discovery-server.enabled=true

        # TLS/Authentication
        http-server.authentication.type=PASSWORD
        http-server.https.enabled=true
        http-server.https.port=8443
        http-server.https.keystore.path=/etc/starburst/certs/keystore.jks
        http-server.https.keystore.key=${ENV:KEYSTORE_PSWD}

        # Access control
        starburst.access-control.enabled=true
        access-control.config-files=/etc/starburst/guard.properties
        starburst.access-control.authorized-groups=admin

        # Insights
        insights.persistence-enabled=true
        insights.metrics-persistence-enabled=true
        insights.jdbc.url=jdbc:postgresql://insightsdb:5432/insights
        insights.jdbc.user=${ENV:INSIGHTS_USR}
        insights.jdbc.password=${ENV:INSIGHTS_PSWD}

      password-authenticator.properties: |-
        password-authenticator.name=ldap
        ldap.url=ldaps://openldap.example.com:636
        ldap.user-bind-pattern=uid=${USER},dc=example,dc=com
        # Issue 3: Trust the LDAP cert fetched by the initContainer
        ldap.ssl.truststore.path=/etc/starburst/certs/keystore.jks
        ldap.ssl.truststore.password=changeit

      guard.properties: |-
        access-control.name=starburst
        
      group-provider.properties: |-
        group-provider.name=file
        file.group-file=/etc/starburst/groups.txt

      log.properties: |-
        io.trino=INFO
        # Issue 3: Enable LDAP Debug Logging
        io.trino.security.ldap.LdapAuthenticator=DEBUG

# -------------------------------
# Worker
# -------------------------------
worker:
  # Issue 1: Cap memory and CPU for local dev laptops
  resources:
    limits:
      memory: "4Gi"
      cpu: 1
    requests:
      memory: "4Gi"
      cpu: 1
  nodeMemoryHeadroom: "512Mi"

  # Issue 2: Give workers access to the secrets so INSIGHTS_PSWD populates
  envFrom:
    - secretRef:
        name: sep-secrets

  etcFiles:
    # Issue 4: Override JVM security to allow older MySQL 5.6 Aurora DH ciphers
    jvm.config: |-
      -server
      -XX:G1HeapRegionSize=32M
      -XX:+ExplicitGCInvokesConcurrent
      -XX:+HeapDumpOnOutOfMemoryError
      -XX:-OmitStackTraceInFastThrow
      -XX:ReservedCodeCacheSize=512M
      -XX:PerMethodRecompilationCutoff=10000
      -XX:PerBytecodeRecompilationCutoff=10000
      -Djdk.attach.allowAttachSelf=true
      -Djdk.nio.maxCachedBufferSize=2000000
      -Dfile.encoding=UTF-8
      --add-opens=java.base/sun.nio.ch=ALL-UNNAMED
      --add-opens=java.base/java.nio=ALL-UNNAMED
      --add-opens=java.base/java.lang=ALL-UNNAMED
      --add-opens=java.security.jgss/sun.security.krb5=ALL-UNNAMED
      -XX:+UseG1GC
      -agentpath:/usr/lib/starburst/bin/libjvmkill.so
      -XX:+UnlockDiagnosticVMOptions
      -XX:G1NumCollectionsKeepPinned=10000000
      -Djdk.attach.allowAttachSelf=true
      -XX:+UseAESCTRIntrinsics
      -XX:GCLockerRetryAllocationCount=100
      -Djdk.tls.disabledAlgorithms=SSLv3, RC4, DES, MD5withRSA, EC keySize < 224, 3DES_EDE_CBC, anon, NULL

  deploymentTerminationGracePeriodSeconds: 1 # dev only
  starburstWorkerShutdownGracePeriodSeconds: 1 # dev only